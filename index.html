<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SOL Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SOL Tracker">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>SOL Tracker</title>
  <meta name="theme-color" content="#000000">
  <style>html,body{background:#000;margin:0}</style>
</head>
<body>
  <script>
    // Daten sichern / laden (PREPIT). Nimmt alle App-Daten (localStorage „flutter.*“).
    window.solDataExport = function () {
      try {
        var data = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('flutter.') === 0) data[k] = localStorage.getItem(k);
        }
        var d = new Date();
        var stamp = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        var text = JSON.stringify({ app: 'prepit', v: 1, created: d.toISOString(), data: data });
        var name = 'PREPIT-Backup-' + stamp + '.json';
        var file = null;
        try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: name }).catch(function () {});
          return true;
        }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        return true;
      } catch (e) { return false; }
    };
    window.solDataImport = function () {
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json,text/plain';
      inp.style.display = 'none';
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        f.text().then(function (t) {
          var j = JSON.parse(t);
          if (!j || j.app !== 'prepit' || !j.data) throw new Error('kein PREPIT-Backup');
          Object.keys(j.data).forEach(function (k) {
            if (k.indexOf('flutter.') === 0) localStorage.setItem(k, j.data[k]);
          });
          location.reload();
        }).catch(function () {
          window.alert('Diese Datei ist kein PREPIT-Backup.');
        });
      };
      document.body.appendChild(inp);
      inp.click();
    };
  </script>
  <script>
    // Lädt immer die neueste Version: latest.json nie aus dem Cache,
    // jede Version liegt in einem eigenen Ordner (b/<version>/).
    (function () {
      function start(base) {
        var b = document.createElement('base');
        b.href = base;
        document.head.appendChild(b);
        var s = document.createElement('script');
        s.src = base + 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      fetch('latest.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          try { localStorage.setItem('sol_tracker_latest_base', j.base); } catch (e) {}
          start(j.base);
        })
        .catch(function () {
          var last = null;
          try { last = localStorage.getItem('sol_tracker_latest_base'); } catch (e) {}
          if (last) start(last);
        });
    })();
  </script>
</body>
</html>
