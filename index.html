<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SOL Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SOL Tracker">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>SOL Tracker</title>
  <meta name="theme-color" content="#000000">
  <style>html,body{background:#000;margin:0}</style>
</head>
<body>
  <script>
    // Lädt immer die neueste Version: latest.json nie aus dem Cache,
    // jede Version liegt in einem eigenen Ordner (b/<version>/).
    (function () {
      function start(base) {
        var b = document.createElement('base');
        b.href = base;
        document.head.appendChild(b);
        var s = document.createElement('script');
        s.src = base + 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      fetch('latest.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          try { localStorage.setItem('sol_tracker_latest_base', j.base); } catch (e) {}
          start(j.base);
        })
        .catch(function () {
          var last = null;
          try { last = localStorage.getItem('sol_tracker_latest_base'); } catch (e) {}
          if (last) start(last);
        });
    })();
  </script>
</body>
</html>
