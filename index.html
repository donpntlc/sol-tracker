<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SOL Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SOL Tracker">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>SOL Tracker</title>
  <meta name="theme-color" content="#000000">
  <style>html,body{background:#000;margin:0;overscroll-behavior:none}</style>
</head>
<body>
  <script>
    // iPhone: Seite darf nie verrutschen (sonst stimmen Tipp-Position und Anzeige nicht überein).
    (function () {
      function reset() {
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      }
      window.addEventListener('scroll', reset, { passive: true });
      // Nach dem Schließen der Tastatur: Flutter neu messen lassen,
      // sonst bleibt unten ein schwarzer Streifen und die Leiste rutscht hoch.
      function nudge() { reset(); window.dispatchEvent(new Event('resize')); }
      document.addEventListener('focusout', function () {
        setTimeout(reset, 50); setTimeout(nudge, 400); setTimeout(nudge, 900);
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) setTimeout(nudge, 200);
      });
      window.addEventListener('resize', function () { setTimeout(reset, 50); });
      window.addEventListener('pageshow', reset);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { setTimeout(reset, 50); });
      }
    })();
  </script>
  <script>
    // Daten sichern / laden (PREPIT). Nimmt alle App-Daten (localStorage „flutter.*“).
    window.solDataExport = function () {
      try {
        var data = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('flutter.') === 0) data[k] = localStorage.getItem(k);
        }
        var d = new Date();
        var stamp = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        var text = JSON.stringify({ app: 'prepit', v: 1, created: d.toISOString(), data: data });
        var name = 'PREPIT-Backup-' + stamp + '.json';
        var file = null;
        try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: name }).catch(function () {});
          return true;
        }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        return true;
      } catch (e) { return false; }
    };
    window.solMacroPlanExport = function (text) {
      try {
        var d = new Date();
        var stamp = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        var name = 'PREPIT-Makroplan-' + stamp + '.json';
        var file = null;
        try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: name }).catch(function () {});
          return true;
        }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        return true;
      } catch (e) { return false; }
    };
    window.solDataImport = function () {
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json,text/plain';
      inp.style.display = 'none';
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        f.text().then(function (t) {
          var j = JSON.parse(t);
          if (!j || j.app !== 'prepit' || !j.data) throw new Error('kein PREPIT-Backup');
          Object.keys(j.data).forEach(function (k) {
            if (k.indexOf('flutter.') === 0) localStorage.setItem(k, j.data[k]);
          });
          location.reload();
        }).catch(function () {
          window.alert('Diese Datei ist kein PREPIT-Backup.');
        });
      };
      document.body.appendChild(inp);
      inp.click();
    };
  </script>
  <script>
    // Versionen: Beim Öffnen wird die neueste Version geladen. Klappt sie nicht
    // (z. B. noch nicht fertig veröffentlicht → schwarzer Bildschirm), wird automatisch
    // die letzte funktionierende Version gestartet. Während die App offen ist,
    // wird nie gewechselt — nur ein Hinweis „Neue Version verfügbar“.
    (function () {
      var OK = 'sol_tracker_ok_base', LAST = 'sol_tracker_latest_base', SKIP = 'sol_tracker_skip_base';
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      var running = null;

      function start(base, fallback) {
        running = base;
        var b = document.createElement('base');
        b.href = base;
        document.head.appendChild(b);
        var shown = false;
        window.addEventListener('flutter-first-frame', function () {
          shown = true;
          set(OK, base);
          try { sessionStorage.removeItem(SKIP); } catch (e) {}
        });
        function bail() {
          if (shown || !fallback || fallback === base) return;
          try { sessionStorage.setItem(SKIP, base); } catch (e) {}
          location.reload();
        }
        var s = document.createElement('script');
        s.src = base + 'flutter_bootstrap.js';
        s.async = true;
        s.onerror = bail;
        document.body.appendChild(s);
        setTimeout(bail, 15000);
      }

      function showUpdateBanner() {
        if (document.getElementById('sol-update')) return;
        var d = document.createElement('div');
        d.id = 'sol-update';
        d.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);' +
          'z-index:99999;background:#1c1c1e;color:#eee;border:1px solid rgba(201,162,74,.55);border-radius:14px;' +
          'padding:12px 40px 12px 14px;font:600 14px -apple-system,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5)';
        d.innerHTML = '<span style="color:#C9A24A">Neue Version verfügbar</span><br>' +
          '<span style="font-weight:400;font-size:12.5px;color:#aaa">App ganz schließen und neu öffnen, um sie zu laden.</span>' +
          '<span id="sol-update-x" style="position:absolute;right:12px;top:10px;font-size:18px;color:#888;cursor:pointer">✕</span>';
        document.body.appendChild(d);
        document.getElementById('sol-update-x').onclick = function () { d.remove(); };
      }

      function checkForUpdate() {
        if (!running) return;
        fetch('latest.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (j.base && j.base !== running) showUpdateBanner(); })
          .catch(function () {});
      }
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) setTimeout(checkForUpdate, 800);
      });
      setInterval(checkForUpdate, 10 * 60 * 1000);

      var ok = get(OK);
      var skip = null;
      try { skip = sessionStorage.getItem(SKIP); } catch (e) {}
      fetch('latest.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          set(LAST, j.base);
          // Neue Version ist eben fehlgeschlagen → diesmal die funktionierende nehmen.
          if (skip && skip === j.base && ok) start(ok, null);
          else start(j.base, ok);
        })
        .catch(function () {
          var last = ok || get(LAST);
          if (last) start(last, null);
        });
    })();
  </script>
</body>
</html>
